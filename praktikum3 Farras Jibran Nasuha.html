<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Biodata Mahasiswa</title>
</head>

<body>

    <h1>BIODATA MAHASISWA</h1>

    <form>
        <label>NIM</label><br>
        <input type="text" name="nim"><br><br>

        <label>Nama Lengkap</label><br>
        <input type="text" name="nama"><br><br>

        <label>Email</label><br>
        <input type="email" name="email"><br><br>

        <label>Tanggal Lahir</label><br>
        <input type="date" name="tanggal_lahir"><br><br>

        <label>Jenis Kelamin</label><br>
        <input type="radio" name="jenis_kelamin" value="laki-laki">
        Laki-laki

        <input type="radio" name="jenis_kelamin" value="perempuan">
        Perempuan

        <br><br>

        <input type="submit" value="SIMPAN">
    </form>


    <h1>MINAT TEKNOLOGI MAHASISWA</h1>

    <form>
        <label>Nama</label><br>
        <input type="text" name="nama"><br><br>

        <label>Pilih Minat:</label><br>

        <input type="checkbox" name="minat" value="web">
        Web Development<br>

        <input type="checkbox" name="minat" value="ai">
        Artificial Intelligence<br>

        <input type="checkbox" name="minat" value="mobile">
        Mobile Development<br>

        <input type="checkbox" name="minat" value="game">
        Game Development<br>

        <input type="checkbox" name="minat" value="cyber">
        Cyber Security<br><br>

        <input type="submit" value="SIMPAN">
    </form>

</body>
</html>
